<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>특별관 지도 — 전국 IMAX · ScreenX · Dolby Cinema</title>
  <meta name="description" content="대한민국 전역의 IMAX, ScreenX, Dolby Cinema 특별관 위치와 상영관 스펙을 지도에서 한눈에 확인하세요." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🎬</span>
      <h1>특별관 지도</h1>
      <span class="brand-sub">전국 IMAX · ScreenX · Dolby Cinema</span>
    </div>
    <nav class="filters" id="filters" aria-label="특별관 종류 필터">
      <button class="filter-btn active" data-format="IMAX">
        <span class="dot dot-imax"></span>IMAX <span class="count" id="count-IMAX"></span>
      </button>
      <button class="filter-btn active" data-format="ScreenX">
        <span class="dot dot-screenx"></span>ScreenX <span class="count" id="count-ScreenX"></span>
      </button>
      <button class="filter-btn active" data-format="DolbyCinema">
        <span class="dot dot-dolby"></span>Dolby Cinema <span class="count" id="count-DolbyCinema"></span>
      </button>
    </nav>
  </header>

  <main class="layout">
    <div id="map" role="application" aria-label="특별관 지도"></div>

    <aside class="panel" id="panel" hidden>
      <button class="panel-close" id="panel-close" aria-label="닫기">×</button>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <div class="map-notice" id="map-notice" hidden>
      <div class="map-notice-card">
        <h2>네이버 지도 키가 필요합니다</h2>
        <p>
          <code>js/config.js</code> 파일의 <code>NAVER_MAP_CLIENT_ID</code>에
          네이버 클라우드 플랫폼에서 발급받은 Maps API 클라이언트 ID(ncpKeyId)를 입력해 주세요.
        </p>
        <p class="small">
          발급: <a href="https://www.ncloud.com/product/applicationService/maps" target="_blank" rel="noopener">NAVER CLOUD PLATFORM → Maps</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
